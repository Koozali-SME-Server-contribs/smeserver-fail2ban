[INCLUDES]
before = iptables-ipset.conf

[Definition]
actionstart =
actionstop =
actionban = for p in $(echo "<port>" | tr ',' ' '); do ipset -exist add <ipmset> <ip>,<protocol>:$p timeout <ipsettime>; done
actionunban = for p in $(echo "<port>" | tr ',' ' '); do ipset -exist del <ipmset> <ip>,<protocol>:$p; done
#actionban = ipset -exist add <ipmset> <ip>,<protocol>:<port> timeout <ipsettime>
#actionunban = ipset -exist del <ipmset> <ip>,<protocol>:<port>

[Init]
ipmset = f2b-ports
protocol = tcp

